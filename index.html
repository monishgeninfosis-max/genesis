<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<title>Daily Calling Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow working column. Sticky header with today's progress, four tabs, a list of lead cards with the outcome buttons directly under each phone number. */
:root{
  --bg:#f0f3f2; --surface:#ffffff; --ink:#14201d; --muted:#56655f; --line:#d9e0dd; --line-strong:#bcc8c3;
  --accent:#0f6b73; --accent-ink:#ffffff; --accent-tint:#dcefef;
  --good:#0b7a4b; --good-t:#dff2e8;
  --warn:#8a5300; --warn-t:#faecd2;
  --bad:#b1261d; --bad-t:#fbe3e0;
  --info:#1c5cb0; --info-t:#e0eaf9;
  --mute:#55645e; --mute-t:#e6ebe9;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#171e1c; --ink:#e7eeeb; --muted:#9aaaa4; --line:#28332f; --line-strong:#3a4944;
    --accent:#58c4cc; --accent-ink:#06201f; --accent-tint:#133234;
    --good:#5fd3a0; --good-t:#12302a; --warn:#f0b95a; --warn-t:#3a2b0e; --bad:#ff958c; --bad-t:#3d1a17;
    --info:#86b6ff; --info-t:#14263f; --mute:#9eada7; --mute-t:#232c29; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#171e1c; --ink:#e7eeeb; --muted:#9aaaa4; --line:#28332f; --line-strong:#3a4944;
  --accent:#58c4cc; --accent-ink:#06201f; --accent-tint:#133234;
  --good:#5fd3a0; --good-t:#12302a; --warn:#f0b95a; --warn-t:#3a2b0e; --bad:#ff958c; --bad-t:#3d1a17;
  --info:#86b6ff; --info-t:#14263f; --mute:#9eada7; --mute-t:#232c29; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;margin:0;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:12px 10px;flex-wrap:wrap}
.brand h1{font-size:18px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;color:var(--muted);font-size:13px}
.prog{min-width:180px;flex:1 1 200px;max-width:320px}
.prog-txt{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px;gap:8px}
.prog-txt b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--mute-t);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{flex:1 1 0;min-width:max-content;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:600;color:var(--muted);font-size:14px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
.badge.zero{background:var(--mute-t);color:var(--muted)}

main{padding-block:14px 90px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.me{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;color:var(--muted)}
.me input,.search,.sel{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:36px}
.me input{width:130px}
.search{flex:1 1 200px;min-width:0}
.notice{background:var(--warn-t);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 8px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* lead card */
.lead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.l1{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.who{min-width:0}
.who h3{font-size:16px;line-height:1.3;margin:0 0 2px;font-weight:600;overflow-wrap:anywhere}
.meta{margin:0;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.prod{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--accent-tint);color:var(--accent)}
.pill{flex:none;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.s-new,.s-na{background:var(--mute-t);color:var(--mute)}
.s-cb{background:var(--warn-t);color:var(--warn)}
.s-int,.s-won{background:var(--good-t);color:var(--good)}
.s-quote,.s-demo{background:var(--info-t);color:var(--info)}
.s-no,.s-bad{background:var(--bad-t);color:var(--bad)}
.contact{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px}
.phone{font-family:var(--font-mono);font-size:18px;font-weight:500;color:var(--ink);text-decoration:none;letter-spacing:.01em;margin-right:4px}
.mini{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 11px;min-height:36px;font-size:13px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.mini.wa{border-color:var(--good);color:var(--good)}
.mini[aria-expanded="true"]{background:var(--accent-tint);border-color:var(--accent);color:var(--accent)}
.script{background:var(--bg);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:14px}
.script p{margin:0 0 8px}
.script .lab{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.script ol{margin:0 0 8px;padding-left:20px}
.script li{margin-bottom:3px}
.script dl{margin:0}
.script dt{font-weight:600;margin-top:6px}
.script dd{margin:0}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.act{min-height:46px;padding:6px 8px;border-radius:10px;border:1.5px solid var(--c,var(--line-strong));background:var(--ct,var(--surface));color:var(--c,var(--ink));font-weight:600;font-size:13.5px;line-height:1.2;text-align:center}
.act[data-s="na"]{--c:var(--mute);--ct:var(--mute-t)}
.act[data-s="cb"]{--c:var(--warn);--ct:var(--warn-t)}
.act[data-s="no"],.act[data-s="bad"]{--c:var(--bad);--ct:var(--bad-t)}
.act[data-s="int"]{--c:var(--good);--ct:var(--good-t)}
.act[data-s="quote"],.act[data-s="demo"]{--c:var(--info);--ct:var(--info-t)}
.act[data-s="won"]{--c:var(--good);--ct:var(--surface)}
.act[aria-pressed="true"]{background:var(--c);color:var(--bg)}
.act[data-s="won"]{border-width:2px}
.acts-lab{font-size:12px;color:var(--muted);margin:10px 0 -2px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.when{background:var(--info-t);border-radius:10px;padding:10px 12px;margin-top:10px}
.when p{margin:0 0 8px;font-weight:600;font-size:14px}
.when .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.when .chip{border-color:var(--info)}
.when input[type=date]{border:1px solid var(--info);border-radius:8px;padding:6px 8px;background:var(--surface);min-height:36px}
.when .link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:6px}
.note{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);resize:vertical;min-height:40px}
.foot{margin-top:8px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:none;border:0;text-align:left;padding:14px 14px 4px;font-size:16px}
.phead b{display:block;font-weight:600;line-height:1.3}
.pbrand{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.chev{flex:none;width:28px;height:28px;border-radius:99px;background:var(--accent-tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.psum{margin:0;padding:0 14px 12px;font-size:14px;color:var(--muted)}
.pbody{border-top:1px solid var(--line);padding:12px 14px 14px;font-size:14px}
.pbody .lab{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:block;margin:10px 0 2px}
.pbody .lab:first-child{margin-top:0}
.pbody ul{margin:0 0 4px;padding-left:20px}
.pbody li{margin-bottom:3px}
.pnote{background:var(--warn-t);color:var(--warn);border-radius:8px;padding:8px 10px;margin:10px 0}
.src{margin-top:8px;text-align:right;font-size:11px;line-height:1.3;color:var(--muted)}
.late{color:var(--bad);font-weight:600}
.today-f{color:var(--warn);font-weight:600}
.lead.compact{padding:10px 14px}
.lead.compact .l2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.lead.compact .ph{font-family:var(--font-mono);font-size:14px;color:var(--muted)}
.more{display:block;width:100%;padding:12px;border:1px dashed var(--line-strong);border-radius:12px;background:none;font-weight:600;color:var(--accent);margin-top:4px}

/* report */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.panel h2{font-size:14px;margin:0 0 10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:12px;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.week{display:flex;gap:8px;align-items:flex-end;height:130px}
.week div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:12px;color:var(--muted)}
.week i{display:block;width:100%;max-width:44px;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px}
.week b{color:var(--ink);font-variant-numeric:tabular-nums}
.help{font-size:13px;color:var(--muted);line-height:1.5}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}
@media (max-width:520px){
  .acts{grid-template-columns:repeat(2,1fr)}
  .me{margin-left:0;width:100%}
  .me input{flex:1}
  .phone{font-size:17px}
}
@media (prefers-reduced-motion:reduce){.bar i,#toast{transition:none}}

/* ---- visual refresh: dark header band, softer cards, bigger touch targets ---- */
:root{--hdr:#0d2a2d;--hdr-ink:#ecf6f5;--hdr-mute:#9dbdbc;--hdr-line:rgba(255,255,255,.14);--glow:#4fd1c5;
  --shadow:0 1px 2px rgba(14,40,38,.06),0 12px 28px -16px rgba(14,40,38,.28);--r:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hdr:#091415;--hdr-mute:#86a5a4;--shadow:0 1px 0 rgba(255,255,255,.04),0 12px 28px -16px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--hdr:#091415;--hdr-mute:#86a5a4;--shadow:0 1px 0 rgba(255,255,255,.04),0 12px 28px -16px rgba(0,0,0,.7)}
body{background:var(--bg)}
body::before{background:var(--hdr)}
.top{background:var(--hdr);border-bottom:0;box-shadow:0 8px 24px -16px rgba(0,0,0,.55)}
.top-row{padding-block:14px 12px}
.brand h1{color:var(--hdr-ink);font-size:21px;font-weight:800;letter-spacing:-.02em}
.brand span{color:var(--hdr-mute)}
.prog-txt{color:var(--hdr-mute)}
.prog-txt b{color:var(--hdr-ink);font-size:15px}
.bar{height:10px;background:var(--hdr-line)}
.bar i{background:var(--glow)}
.tabs{gap:6px;padding-bottom:12px}
.tab{flex:0 0 auto;border:0;border-radius:99px;padding:9px 16px;color:var(--hdr-mute);font-weight:600;transition:background .15s,color .15s}
.tab:hover{background:var(--hdr-line);color:var(--hdr-ink)}
.tab[aria-selected="true"]{background:var(--hdr-ink);color:var(--hdr)}
.tab[aria-selected="true"] .badge.zero{background:rgba(13,42,45,.12);color:var(--hdr)}
.badge.zero{background:var(--hdr-line);color:var(--hdr-mute)}
.lead,.pcard,.tile,.panel{border-radius:var(--r);box-shadow:var(--shadow);border-color:transparent}
.lead{padding:16px}
.who h3{font-size:17px;font-weight:650;letter-spacing:-.01em}
.pill{padding:4px 11px;font-size:12.5px}
.contact{margin-top:14px}
.phone{background:var(--accent-tint);padding:7px 12px;border-radius:12px;font-size:18px;color:var(--ink)}
.mini{border-radius:10px;transition:background .15s,transform .1s}
.mini:active,.chip:active{transform:scale(.97)}
.act{border-radius:12px;min-height:50px;font-weight:650;transition:transform .1s,filter .15s}
.act:hover{filter:brightness(.97)}
.act:active{transform:scale(.97)}
.act[aria-pressed="true"]{box-shadow:0 6px 14px -8px var(--c)}
.chip{transition:background .15s,transform .1s}
.chip[aria-pressed="true"]{box-shadow:0 6px 14px -8px var(--accent)}
.sec{margin-top:22px}
.script{border-radius:12px}
.when{border-radius:12px}
.more{border-radius:var(--r);background:var(--surface);border:1px solid var(--line-strong);border-style:dashed}
.tile{padding:14px 16px}
.tile b{font-size:30px;letter-spacing:-.02em}
.empty{border-radius:var(--r)}
.notice{border-radius:12px}
.chev{background:var(--accent);color:var(--accent-ink)}
#toast{background:var(--hdr);color:var(--hdr-ink);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
</style>
</head>
<body>

<header class="top">
  <div class="in">
    <div class="top-row">
      <div class="brand"><h1>Daily Calling Desk</h1><span id="today"></span></div>
      <div class="prog">
        <div class="prog-txt"><span><b id="pn">0</b> calls aaj</span><span>target <span id="pt">40</span></span></div>
        <div class="bar"><i id="pb"></i></div>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="today" id="tab-today">Aaj ki list</button>
      <button class="tab" role="tab" data-tab="fu" id="tab-fu">Follow-up <span class="badge zero" id="fub">0</span></button>
      <button class="tab" role="tab" data-tab="all" id="tab-all">Sab leads</button>
      <button class="tab" role="tab" data-tab="prod" id="tab-prod">Products</button>
      <button class="tab" role="tab" data-tab="report" id="tab-report">Report</button>
    </nav>
  </div>
</header>
<div class="in"><main id="main"><div class="empty">Load ho raha hai…</div></main></div>
<div id="toast" role="status" aria-live="polite"></div>

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s,n) => { const [y,m,d] = s.split("-").map(Number); return ymd(new Date(y,m-1,d+n)); };
const diffDays = (a,b) => { const p = s => { const [y,m,d] = s.split("-").map(Number); return Date.UTC(y,m-1,d); }; return Math.round((p(a)-p(b))/86400000); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = s => { const [y,m,d] = s.split("-").map(Number); return d+" "+MON[m-1]; };
function rel(s){
  const d = diffDays(s, today());
  if(d===0) return "<span class=today-f>aaj</span>";
  if(d===1) return "kal";
  if(d<0) return "<span class=late>"+(-d)+" din late ("+fmt(s)+")</span>";
  return fmt(s);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function persistLead(id){
  mirror();
  if(!db) return;
  const doc = P[id];
  writeQ[id] = (writeQ[id]||Promise.resolve()).then(() => doc ? db.collection("leads").doc(id).set(doc) : db.collection("leads").doc(id).delete())
    .catch(e => { dbWarn = "Cloud mein save nahi ho paya ("+(e&&e.code||"error")+"). Is browser mein save ho raha hai."; render(); });
}
function persistDay(date){
  mirror();
  if(!db) return;
  db.doc("days/"+date).set(DAYS[date]).catch(() => {});
}

function setStatus(id, s, fu){
  const t = today(), cur = P[id] || {};
  const n = (cur.n||0) + 1;
  let f = "";
  if(!FINAL.has(s)){
    if(s==="na") f = addDays(t, n>=3 ? 3 : 1);
    else f = fu || addDays(t,1);
  }
  P[id] = {s, d:t, f, n, note:cur.note||"", log:[...(cur.log||[]), [t,s]].slice(-12)};
  delete ui.pick[id];
  persistLead(id);
  const msg = {na:"Kal dobara try karenge", cb:"Follow-up "+(f?fmt(f):""), int:"Follow-up "+(f?fmt(f):""), quote:"Follow-up "+(f?fmt(f):""), demo:"Demo "+(f?fmt(f):""), won:"Deal won, badhai!", no:"Band kar diya", bad:"Galat number mark ho gaya"}[s];
  toast(msg);
  render();
}
function saveNote(id, text){
  const cur = P[id] || {s:"new", d:"", f:"", n:0, log:[]};
  if((cur.note||"") === text) return;
  P[id] = {...cur, note:text};
  persistLead(id);
}
function resetLead(id){ delete P[id]; delete ui.open[id]; persistLead(id); render(); }

/* ---------- daily queue ---------- */
function pickNew(n, skip){
  const sk = new Set(skip||[]);
  return ORDER.filter(l => !P[l.id] && !sk.has(l.id)).slice(0,n).map(l => l.id);
}
async function ensureQueue(){
  const t = today();
  let ids = null;
  if(db){
    try{ const s = await db.doc("days/"+t).get(); if(s.exists) ids = s.data().ids; }catch(e){ ids = DAYS[t] && DAYS[t].ids; }
  } else ids = DAYS[t] && DAYS[t].ids;
  if(!ids){ ids = pickNew(DAILY); DAYS[t] = {ids}; persistDay(t); }
  else { DAYS[t] = {ids}; mirror(); }
  queueIds = ids.filter(id => BYID[id]);
  render();
}
function addMore(){
  const t = today();
  const more = pickNew(10, queueIds);
  if(!more.length){ toast("Aur naye leads nahi bache"); return; }
  queueIds = queueIds.concat(more);
  DAYS[t] = {ids:queueIds}; persistDay(t);
  render();
}

    + (open ? '<div class="pbody">'+prodList("Kinko bechna hai", p.who)+prodList("Ye sawaal puchho", p.ask)+prodList("Bechne ka angle", p.angle)
      + (p.note ? '<p class="pnote">'+esc(p.note)+"</p>" : "")
      + '<button class="mini" data-do="prodleads" data-id="'+p.id+'">Is product ke leads dikhao</button></div>' : "")
    + "</article>";
}
function tabProd(){
  let h = '<p class="help">Ye general product categories hain. Gen Infosis kaun se brand aur plan bechti hai aur price kya hai, ye manager se confirm karke mujhe bata do, main yahan add kar dunga. Kisi bhi category par tap karo.</p>';
  ["d","s"].forEach(line => {
    const ps = PRODS.filter(p => p.line===line);
    h += '<div class="sec"><span>'+PGROUPS[line]+"</span><span>"+ps.length+" categories</span></div>"+ps.map(prodCard).join("");
  });
  return h;
}
function tabReport(){
  const vals = Object.entries(P).filter(e => BYID[e[0]]).map(e => e[1]);
  const cnt = k => vals.filter(p => p.s===k).length;
  const called = vals.length;
  const talked = vals.filter(p => p.s!=="na" && p.s!=="bad").length;
  const inter = cnt("int")+cnt("quote")+cnt("demo");
  const won = cnt("won");
  const left = ORDER.filter(l => !P[l.id]).length;
  const rowFor = line => {
    const ids = ORDER.filter(l => CATS[l.c].line===line);
    const ps = ids.map(l => P[l.id]).filter(Boolean);
    return "<tr><td>"+LINES[line]+"</td><td>"+ids.length+"</td><td>"+ps.length+"</td><td>"+ps.filter(p => ["int","quote","demo"].includes(p.s)).length+"</td><td>"+ps.filter(p => p.s==="won").length+"</td></tr>";
  };
  const srcs = {};
  ORDER.forEach(l => { const o = srcs[l.src] || (srcs[l.src] = [0,0,0]); o[0]++; const p = P[l.id]; if(p){ o[1]++; if(["int","quote","demo","won"].includes(p.s)) o[2]++; } });
  const srcRows = Object.keys(srcs).sort((a,b) => srcs[b][0]-srcs[a][0]).map(k => "<tr><td>"+esc(k)+"</td><td>"+srcs[k][0]+"</td><td>"+srcs[k][1]+"</td><td>"+srcs[k][2]+"</td></tr>").join("");
  const cities = {};
  ORDER.forEach(l => { const o = cities[l.city2] || (cities[l.city2] = [0,0,0]); o[0]++; const p = P[l.id]; if(p){ o[1]++; if(["int","quote","demo","won"].includes(p.s)) o[2]++; } });
  const cityRows = CITIES.map(k => "<tr><td>"+esc(k)+"</td><td>"+cities[k][0]+"</td><td>"+cities[k][1]+"</td><td>"+cities[k][2]+"</td></tr>").join("");
  const t = today(), days = [];
  for(let i=6;i>=0;i--){ const d = addDays(t,-i); let n = 0; vals.forEach(p => (p.log||[]).forEach(x => { if(x[0]===d) n++; })); days.push([d,n]); }
  const mx = Math.max(1, ...days.map(d => d[1]));
  return '<div class="tiles">'
    + [["Total leads",LEADS.length],["Call kiye",called],["Baat hui",talked],["Interested",inter],["Deal won",won]].map(x => '<div class="tile"><b>'+x[1]+"</b><span>"+x[0]+"</span></div>").join("")
    + '</div><div class="panel"><h2>Pichhle 7 din ki calls</h2><div class="week">'
    + days.map(d => '<div><b>'+d[1]+'</b><i style="height:'+Math.round(d[1]/mx*80)+'%"></i><span>'+fmt(d[0])+"</span></div>").join("")
    + '</div></div><div class="panel scroll"><h2>Product ke hisaab se</h2><table class="tbl"><thead><tr><th>Product</th><th>Leads</th><th>Call</th><th>Interested</th><th>Won</th></tr></thead><tbody>'+rowFor("d")+rowFor("s")+"</tbody></table></div>"
    + '<div class="panel scroll"><h2>Source ke hisaab se (kahan se lead mila, kahan se deal aayi)</h2><table class="tbl"><thead><tr><th>Source</th><th>Leads</th><th>Call</th><th>Interested / Won</th></tr></thead><tbody>'+srcRows+"</tbody></table></div>"
    + '<div class="panel scroll"><h2>Shehar ke hisaab se</h2><table class="tbl"><thead><tr><th>Shehar</th><th>Leads</th><th>Call</th><th>Interested / Won</th></tr></thead><tbody>'+cityRows+"</tbody></table></div>"
    + '<div class="panel"><h2>Leads ka stock</h2><p class="help">Abhi tak bina call wale leads: <b>'+left+"</b>. Roz "+DAILY+" naye leads apne aap list mein aate hain. List "+DATA_DATE+" tak ki hai. Bache hue leads 80 se kam hon to Claude ko bolo “naye leads add karo”, wo nayi list dhundh ke is page mein jod dega.</p></div>";
}

function renderTab(){
  renderHead();
  if(tab==="today") main.innerHTML = tabToday();
  else if(tab==="fu") main.innerHTML = tabFu();
  else if(tab==="all"){ main.innerHTML = tabAll(); $("fl").value = ui.fline; $("fs").value = ui.fstat; }
  else if(tab==="prod") main.innerHTML = tabProd();
  else main.innerHTML = tabReport();
  renderList();
}
function renderList(){
  const el = $("list");
  if(!el) return;
  el.innerHTML = tab==="today" ? listToday() : tab==="fu" ? listFu() : listAll();
}
function render(){
  const a = document.activeElement;
  if(a && a.closest && a.closest("#list") && (a.tagName==="TEXTAREA" || a.tagName==="INPUT")){ pending = true; renderHead(); return; }
  pending = false;
  renderHead();
  if(tab==="report") main.innerHTML = tabReport(); else if(tab==="prod") main.innerHTML = tabProd(); else renderList();
}

/* ---------- events ---------- */
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  tab = b.dataset.tab; ui.limit = 50; renderTab(); window.scrollTo(0,0);
});
main.addEventListener("click", e => {
  const line = e.target.closest("[data-line]");
  if(line){ ui.line = line.dataset.line; renderTab(); return; }
  const b = e.target.closest("[data-do]"); if(!b) return;
  const act = b.dataset.do, id = b.dataset.id;
  if(act==="copy"){
    const ph = b.dataset.ph;
    const ok = () => toast("Number copy ho gaya");
    const fb = () => { const ta = document.createElement("textarea"); ta.value = ph; document.body.appendChild(ta); ta.select(); let r = false; try{ r = document.execCommand("copy"); }catch(x){} ta.remove(); toast(r ? "Number copy ho gaya" : "Number select karke copy karo"); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ph).then(ok, fb); else fb();
  }
  else if(act==="script"){ ui.script[id] = !ui.script[id]; render(); }
  else if(act==="open"){ ui.open[id] = true; render(); }
  else if(act==="close"){ delete ui.open[id]; render(); }
  else if(act==="reset"){ resetLead(id); }
  else if(act==="set"){ if(PICK[b.dataset.s]){ ui.pick[id] = b.dataset.s; render(); } else setStatus(id, b.dataset.s); }
  else if(act==="commit"){ setStatus(id, b.dataset.s, addDays(today(), Number(b.dataset.days))); }
  else if(act==="cancel"){ delete ui.pick[id]; render(); }
  else if(act==="more"){ addMore(); }
  else if(act==="ptoggle"){ ui.prod[id] = !ui.prod[id]; render(); }
  else if(act==="prodleads"){ const p = PRODS.find(x => x.id===id); ui.fcats = p.cats; ui.fcatsLabel = p.t; ui.fline = "all"; ui.fstat = "all"; ui.q = ""; ui.limit = 50; tab = "all"; renderTab(); window.scrollTo(0,0); }
  else if(act==="clearcats"){ ui.fcats = null; renderTab(); }
  else if(act==="limit"){ ui.limit += 50; renderList(); }
});
main.addEventListener("change", e => {
  const t = e.target;
  if(t.classList.contains("dp")){ if(t.value) setStatus(t.dataset.id, t.dataset.s, t.value); }
  else if(t.classList.contains("note")){ saveNote(t.dataset.id, t.value.trim()); }
  else if(t.id==="fl"){ ui.fline = t.value; renderList(); }
  else if(t.id==="tc" || t.id==="fc"){ ui.city = t.value; ui.limit = 50; renderList(); }
  else if(t.id==="fs"){ ui.fstat = t.value; renderList(); }
});
main.addEventListener("input", e => {
  const t = e.target;
  if(t.id==="q"){ ui.q = t.value; ui.limit = 50; renderList(); }
  else if(t.id==="me"){ try{ localStorage.setItem("cd.me", t.value.trim()); }catch(x){} }
});
main.addEventListener("focusout", () => { setTimeout(() => { if(pending){ const a = document.activeElement; if(!(a && a.closest && a.closest("#list") && (a.tagName==="TEXTAREA"||a.tagName==="INPUT"))) render(); } }, 60); });

/* ---------- boot ---------- */
function startLocal(){
  const s = lsRead(); P = s.leads || {}; DAYS = s.days || {};
  queueStarted = true; ensureQueue();
}
async function boot(){
  renderTab();
  try{ db = (window.claude && window.claude.use) ? await window.claude.use("db") : null; }catch(e){ db = null; }
  if(!db){ startLocal(); return; }
  const s0 = lsRead(); DAYS = s0.days || {};
  try{
    db.collection("leads").onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); });
      // first load: if the cloud is empty but this browser has older local data, keep working from cloud only
      P = m; mirror();
      if(!snap.metadata.fromCache && !queueStarted){ queueStarted = true; ensureQueue(); }
      else render();
    }, () => { db = null; if(!queueStarted) startLocal(); });
    setTimeout(() => { if(!queueStarted){ queueStarted = true; ensureQueue(); } }, 5000);
  }catch(e){ db = null; startLocal(); }
}
boot();
})();
</script>
